name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9.25"
            coverage-version: "7.10.7"
          - python-version: "3.12.14"
            coverage-version: "7.16.0"
          - python-version: "3.14.7"
            coverage-version: "7.16.0"
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client
          persist-credentials: false
      - name: Check out the paired marketplace contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exactory/marketplace
          ref: main
          path: marketplace
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Lean and build the real smoke fixture
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: client/skills/math-solver/harness/fixtures/lean-smoke
          build: true
      - name: Compile every Python source
        run: |
          for file in bin/*; do
            if [ -f "$file" ]; then
              python3 -m py_compile "$file"
            fi
          done
          python3 -m compileall -q hooks codex research_harness tests skills/math-solver/harness
      - name: Check Codex entrypoints and hook registrations
        run: python3 codex/generate.py --check
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Measure Codex adapter coverage, including hook subprocesses
        run: |
          python3 -m pip install coverage==${{ matrix.coverage-version }}
          python3 -m coverage run --rcfile=codex/coverage.ini -m unittest discover -s tests -p test_codex.py -v
          python3 -m coverage combine --rcfile=codex/coverage.ini
          python3 -m coverage report --rcfile=codex/coverage.ini
      - name: Run the math-solver harness tests
        run: python3 -m unittest discover -s skills/math-solver/harness/tests -t skills/math-solver/harness -v
      - name: Validate every JSON file
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n 1 python3 -m json.tool > /dev/null
