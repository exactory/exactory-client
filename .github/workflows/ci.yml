name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every Python source
        run: |
          for file in bin/*; do
            python3 -m py_compile "$file"
          done
          python3 -m compileall -q hooks codex tests skills/math-solver/harness
      - name: Check Codex entrypoints and hook registrations
        run: python3 codex/generate.py --check
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Run the math-solver harness tests
        run: python3 -m unittest discover -s skills/math-solver/harness/tests -t skills/math-solver/harness -v
      - name: Validate every JSON file
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 \
            | xargs -0 -n 1 python3 -m json.tool > /dev/null
