name: Maintain Lean cache

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    name: Maintain the default-branch Lean toolchain
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: client
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Restore the Lean toolchain of the smoke fixture
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        continue-on-error: true
        with:
          path: ~/.elan
          key: elan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/skills/math-solver/harness/fixtures/lean-smoke/lean-toolchain') }}
      - name: Install Lean, retrying failed downloads
        run: python3 ci/install_lean.py skills/math-solver/harness/fixtures/lean-smoke
      - name: Build the real smoke fixture
        working-directory: client/skills/math-solver/harness/fixtures/lean-smoke
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" build
      - name: Save the Lean toolchain for later runs
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 15
        continue-on-error: true
        with:
          path: ~/.elan
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
